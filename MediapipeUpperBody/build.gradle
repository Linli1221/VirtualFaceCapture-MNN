// :MediapipeUpperBody
// -----------------------------------------------------------------------------
// 上半身关键点采集（官方 MediaPipe Tasks PoseLandmarker，LIVE_STREAM 模式）。
//
// 输入：相机 YUV_420_888（app 侧按 30fps 抽帧后包装成 Yuv420Frame）
// 输出：CommonData.UpperBodyPoseFrame（13 个上半身点 + 相对基线躯干角）
//
// 依赖边界（docs/upper-body.md §3.2）：只依赖 :CommonData + androidx.core +
// com.google.mediapipe:tasks-vision；不引 Compose / App 类 / :MediapipeFaceLandmark。
// -----------------------------------------------------------------------------

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.example.mediapipeupperbody'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    androidResources {
        // .task 是 zip（内部是 tflite）。保持不压缩，避免 MediaPipe 用 openFd 读取
        // asset 时遇到 "This file can not be opened as a file descriptor"。
        // library 模块的 noCompress 会合并进最终 APK。
        noCompress += "task"
    }
}

dependencies {
    // UpperBodyPoseFrame / BodyPoint / UpperBodyLandmarkIndex 会被 app 直接使用，故用 api
    api project(':CommonData')
    implementation libs.androidx.core.ktx
    // 官方 MediaPipe Tasks（PoseLandmarker）；版本统一由 gradle/libs.versions.toml 管理
    implementation libs.mediapipe.tasks.vision
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
