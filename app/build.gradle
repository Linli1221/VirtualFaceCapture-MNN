plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

// ─────────────────────────────────────────────────────────────────────────────
// Release 签名
//
// 读取顺序：环境变量（CI Secrets） → keystore.properties（本地）。
// 两者都没有时回退到 debug key：包能出、也能装，但 **CI 每次的 debug key 都是新的**，
// 签名不一样 → 覆盖安装会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，必须先卸载。
// 正式签名方式见 README「签名 / Release 打包」。
// ─────────────────────────────────────────────────────────────────────────────
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def releaseStoreFile = System.getenv('RELEASE_STORE_FILE') ?: keystoreProps.getProperty('storeFile')
def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')

def hasReleaseSigning =
        releaseStoreFile && rootProject.file(releaseStoreFile).exists() &&
        releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.example.virtualfacecapture'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.virtualfacecapture"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        // GitHub Actions 通过 -PversionCodeOverride / -PversionNameOverride 注入版本号，
        // 本地构建无该属性时保持默认值不变（必须传 Integer 给 versionCode，勿用命令链写法）
        def ciVersionCode = project.findProperty('versionCodeOverride')
        def ciVersionName = project.findProperty('versionNameOverride')
        Integer vCode = ciVersionCode == null ? 1 : ciVersionCode.toString().toInteger()
        String vName = ciVersionName == null ? '1.0' : ciVersionName.toString()
        versionCode vCode
        versionName vName
        ndk{
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // 只有真的拿到 keystore 才创建 release 配置，否则 AGP 会因缺字段直接报错。
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // v1 兼容 Android 6 及以下，v2/v3 供 7.0+ 校验，全开最稳
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            // debug 包同样用固定 key 签名（配了的话）。
            // 原因：CI 现在默认只出 debug 包，而 AGP 自动生成的 debug key 每台 runner
            // 都不一样 —— 不固定的话每次装新包都得先卸载。debug 包本身仍可调试。
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
}

dependencies {

    // Face-capture SDK (aggregates :MediapipeFaceLandmark + :OpenSeeFaceProcess + :CommonData
    // via `api`, so transitive types like ARKitBlendShapes / Point3D are visible here)
    implementation project(':facecapture-sdk')
    // Live2D rendering only - demo-app concern, not part of the AAR
    implementation project(':Live2D')
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}