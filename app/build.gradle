plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.example.virtualfacecapture'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.virtualfacecapture"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        // GitHub Actions 通过 -PversionCodeOverride / -PversionNameOverride 注入版本号，
        // 本地构建无该属性时保持默认值不变（必须传 Integer 给 versionCode，勿用命令链写法）
        def ciVersionCode = project.findProperty('versionCodeOverride')
        def ciVersionName = project.findProperty('versionNameOverride')
        Integer vCode = ciVersionCode == null ? 1 : ciVersionCode.toString().toInteger()
        String vName = ciVersionName == null ? '1.0' : ciVersionName.toString()
        versionCode vCode
        versionName vName
        ndk{
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
}

dependencies {

    // Face-capture SDK (aggregates :MediapipeFaceLandmark + :OpenSeeFaceProcess + :CommonData
    // via `api`, so transitive types like ARKitBlendShapes / Point3D are visible here)
    implementation project(':facecapture-sdk')
    // Live2D rendering only - demo-app concern, not part of the AAR
    implementation project(':Live2D')
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}